<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tradutor</title>
<link rel="preconnect" href="https://translate.googleapis.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script>
  (() => {
    let t = null;
    try { t = localStorage.getItem('tv.theme'); } catch {}
    document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  })();
  window.coi = { quiet: true };
</script>
<!-- GitHub Pages não permite cabeçalhos COOP/COEP; este service worker os adiciona (voz bem mais rápida) -->
<script src="coi-serviceworker.js"></script>
<style>
  :root { --bg:#fff; --surface:#f4f4f5; --fg:#18181b; --mute:#71717a; --line:#e4e4e7; --rec:#e5484d; color-scheme:light; }
  [data-theme=dark] { --bg:#0b0b0c; --surface:#18181b; --fg:#ededef; --mute:#8b8b93; --line:#27272a; color-scheme:dark; }
  * { box-sizing:border-box; margin:0; }
  [hidden] { display:none !important; }
  body { background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
  svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  main { max-width:720px; margin:0 auto; padding:20px 16px 64px; display:grid; gap:20px; }

  header { display:flex; align-items:center; gap:10px; }
  .brand { font-weight:600; font-size:17px; margin-right:auto; letter-spacing:-.01em; }
  .seg { display:flex; background:var(--surface); border-radius:10px; padding:3px; }
  .seg button { border:0; background:none; padding:5px 14px; border-radius:7px; color:var(--mute); font-weight:500; font-size:14px; }
  .seg button[aria-selected=true] { background:var(--bg); color:var(--fg); box-shadow:0 1px 2px #0000001f; }

  .icon { width:34px; height:34px; display:inline-grid; place-items:center; border:0; background:none; border-radius:8px; color:var(--mute); }
  .icon:hover { background:var(--surface); color:var(--fg); }
  [data-theme=dark] .i-sun, [data-theme=light] .i-moon { display:none; }

  .bar { display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:center; }
  select { width:100%; min-width:0; font:inherit; color:inherit; background:var(--surface); border:1px solid transparent; border-radius:10px; padding:9px 10px; }
  select:hover { border-color:var(--line); }

  /* Voz */
  .voice { display:grid; justify-items:center; gap:12px; padding:24px 0 4px; }
  #mic { width:76px; height:76px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; transition:background .15s, box-shadow .2s, border-color .15s; }
  #mic svg { width:28px; height:28px; }
  #mic:hover { border-color:var(--mute); }
  #mic .i-stop { display:none; fill:currentColor; stroke:none; }
  #mic.on { background:var(--rec); border-color:var(--rec); color:#fff; }
  #mic.on .i-mic { display:none; }
  #mic.on .i-stop { display:block; }
  #mic.talk { box-shadow:0 0 0 8px color-mix(in srgb, var(--rec) 22%, transparent); }
  #status { font-size:13px; color:var(--mute); text-align:center; }
  #live { min-height:1.6em; max-width:560px; text-align:center; font-size:17px; color:var(--mute); }

  /* Texto */
  .text { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .pane { display:flex; flex-direction:column; min-height:220px; min-width:0; }
  .pane + .pane { border-left:1px solid var(--line); background:var(--surface); }
  textarea { flex:1; border:0; resize:none; background:none; color:inherit; font:inherit; font-size:18px; line-height:1.5; padding:16px; outline:none; }
  textarea::placeholder { color:var(--mute); }
  #output { flex:1; padding:16px; font-size:18px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; transition:opacity .15s; }
  #output:empty::before { content:"Tradução"; color:var(--mute); }
  #output.pending { opacity:.5; }
  #output.err { color:var(--rec); }
  .foot { display:flex; align-items:center; justify-content:flex-end; gap:2px; padding:4px 6px; min-height:42px; }
  .count { margin-right:auto; padding-left:10px; font-size:12px; color:var(--mute); }

  /* Histórico */
  .h-head { display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; padding-bottom:4px; }
  .h-head .icon { width:30px; height:30px; }
  .h-head svg { width:16px; height:16px; }
  #hist { list-style:none; padding:0; }
  .item { display:grid; grid-template-columns:1fr auto; column-gap:8px; padding:12px 0; border-top:1px solid var(--line); content-visibility:auto; contain-intrinsic-size:auto 64px; }
  .tran { font-size:16px; overflow-wrap:anywhere; white-space:pre-wrap; }
  .tran.pending { color:var(--mute); }
  .tran.err { color:var(--rec); }
  .orig { grid-column:1; font-size:14px; color:var(--mute); overflow-wrap:anywhere; }
  .acts { grid-column:2; grid-row:1 / span 2; display:flex; align-self:start; opacity:0; transition:opacity .12s; }
  .acts .icon { width:30px; height:30px; }
  .acts svg { width:16px; height:16px; }
  .item:hover .acts, .item:focus-within .acts { opacity:1; }
  @media (hover:none) { .acts { opacity:1; } }


  @media (max-width:640px) {
    .brand { display:none; }
    header { justify-content:space-between; }
    .text { grid-template-columns:1fr; }
    .pane + .pane { border-left:0; border-top:1px solid var(--line); }
    .pane { min-height:160px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></symbol>
  <symbol id="i-speak" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h15l-4-4M20 16H5l4 4"/></symbol>
</svg>

<main>
  <header>
    <div class="brand">Tradutor</div>
    <nav class="seg" role="tablist" aria-label="Modo">
      <button role="tab" data-mode="voice" aria-selected="true">Voz</button>
      <button role="tab" data-mode="text" aria-selected="false">Texto</button>
    </nav>
    <button class="icon" id="theme" title="Alternar tema" aria-label="Alternar tema claro/escuro">
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="bar">
    <select id="src" aria-label="Idioma de origem"></select>
    <button class="icon" id="swap" title="Inverter idiomas" aria-label="Inverter idiomas"><svg><use href="#i-swap"/></svg></button>
    <select id="dst" aria-label="Idioma de destino"></select>
  </div>

  <section class="voice" id="voice">
    <button id="mic" aria-label="Iniciar ou parar gravação" aria-pressed="false">
      <svg class="i-mic"><use href="#i-mic"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
    </button>
    <div id="status">Toque no microfone para falar</div>
    <div id="live" aria-live="polite"></div>
  </section>

  <section class="text" id="text" hidden>
    <div class="pane">
      <textarea id="input" placeholder="Digite ou cole um texto" maxlength="5000" spellcheck="false"></textarea>
      <div class="foot">
        <span class="count" id="count">0 / 5000</span>
        <button class="icon" id="inSpeak" title="Ouvir" aria-label="Ouvir texto"><svg><use href="#i-speak"/></svg></button>
        <button class="icon" id="inClear" title="Limpar" aria-label="Limpar texto"><svg><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div class="pane">
      <div id="output" aria-live="polite"></div>
      <div class="foot">
        <button class="icon" id="outSpeak" title="Ouvir" aria-label="Ouvir tradução"><svg><use href="#i-speak"/></svg></button>
        <button class="icon" id="outCopy" title="Copiar" aria-label="Copiar tradução"><svg><use href="#i-copy"/></svg></button>
      </div>
    </div>
  </section>

  <section id="history" hidden>
    <div class="h-head">
      Histórico
      <button class="icon" id="clearHist" title="Limpar histórico" aria-label="Limpar histórico"><svg><use href="#i-trash"/></svg></button>
    </div>
    <ol id="hist"></ol>
  </section>
</main>


<template id="tpl-item">
  <li class="item">
    <p class="tran"></p>
    <p class="orig"></p>
    <div class="acts">
      <button class="icon" data-act="speak" title="Ouvir" aria-label="Ouvir"><svg><use href="#i-speak"/></svg></button>
      <button class="icon" data-act="copy" title="Copiar" aria-label="Copiar"><svg><use href="#i-copy"/></svg></button>
    </div>
  </li>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
